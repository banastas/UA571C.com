<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>Remote Link Lost // UA 571-C</title>
  <style>
    :root { color-scheme: dark; font-family: Monaco, "Courier New", monospace; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100svh; margin: 0; place-items: center; background: #020300; color: #817400; text-transform: uppercase; }
    main { width: min(90vw, 42rem); padding: clamp(1.5rem, 6vw, 4rem); border: 2px solid #817400; box-shadow: 0 0 24px #81740033; text-align: center; }
    p { line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; padding: .65rem 1rem; border: 1px solid #817400; color: inherit; text-decoration: none; }
    a:hover, a:focus-visible { background: #817400; color: #000; }
  </style>
</head>
<body>
  <main>
    <h1>Remote Link Lost</h1>
    <p>UA 571-C terminal endpoint unavailable.</p>
    <a href="/">Reinitialize System</a>
  </main>
</body>
</html>
